<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="leftArmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22e1ff" />
      <stop offset="100%" stop-color="#007bf4" />
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#461bef" />
      <stop offset="100%" stop-color="#2a168a" />
    </linearGradient>
    <linearGradient id="rightArmGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3ddb" />
      <stop offset="100%" stop-color="#a701ce" />
    </linearGradient>
    <linearGradient id="centerGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#8312dc" />
      <stop offset="100%" stop-color="#461bef" />
    </linearGradient>
  </defs>

  <!-- Stem -->
  <polygon points="43,54 57,54 57,90 43,90" fill="url(#stemGrad)" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round" />
  <line x1="50" y1="54" x2="50" y2="90" stroke="#8f7dff" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Left Upper Arm -->
  <polygon points="14,14 40,14 50,54 36,54 14,24" fill="url(#leftArmGrad)" stroke="#22e1ff" stroke-width="1.5" stroke-linejoin="round" />
  <polygon points="22,18 36,18 45,50 36,50" fill="#007bf4" opacity="0.6" stroke="#ffffff" stroke-width="0.8" />

  <!-- Right Upper Arm -->
  <polygon points="86,14 60,14 50,54 64,54 86,24" fill="url(#rightArmGrad)" stroke="#ff3ddb" stroke-width="1.5" stroke-linejoin="round" />
  <polygon points="78,18 64,18 55,50 64,50" fill="#a701ce" opacity="0.6" stroke="#ffffff" stroke-width="0.8" />

  <!-- Central Diamond Facet -->
  <polygon points="50,42 42,54 50,66 58,54" fill="url(#centerGrad)" stroke="#ffffff" stroke-width="1.4" />

  <!-- Wireframe Accent Crosshairs -->
  <line x1="14" y1="14" x2="50" y2="54" stroke="#ffffff" stroke-width="0.8" opacity="0.8" />
  <line x1="86" y1="14" x2="50" y2="54" stroke="#ffffff" stroke-width="0.8" opacity="0.8" />
</svg>
